server:
  port: ${SERVER_PORT:8081}   # 8081 drone, 8082 commande, 8083 slice ; 8080 = la passerelle

spring:
  application:
    name: drone-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/drone}
    username: ${SPRING_DATASOURCE_USERNAME:drone}
    password: ${SPRING_DATASOURCE_PASSWORD:drone}
  jpa:
    hibernate:
      ddl-auto: validate      # Flyway crée le schéma ; Hibernate vérifie seulement
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    level: "%5p [drone-service] [corr=%X{correlationId:-}]"